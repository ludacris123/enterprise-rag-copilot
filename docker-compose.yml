services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=INFO
    env_file: .env
    depends_on: [postgres, redis]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U copilot"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10}
volumes: {postgres_data: {}}
