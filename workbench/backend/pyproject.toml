[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-workbench"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
 "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
 "PyJWT>=2.10,<3", "argon2-cffi>=23.1", "email-validator>=2.2,<3",
 "python-multipart>=0.0.20", "httpx[socks]>=0.28,<1", "redis>=5.2,<7",
 "celery>=5.4,<6", "langgraph>=1,<2", "prometheus-client>=0.21,<1",
 "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "pypdf>=5,<7", "tenacity>=9,<10"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]
semantic = ["sentence-transformers>=3,<6"]
quantization = ["torch>=2.6", "transformers>=4.50,<5", "accelerate>=1", "bitsandbytes>=0.45"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
