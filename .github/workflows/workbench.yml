name: Workbench CI
on:
  push:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workbench/backend/requirements.lock
      - run: pip install -r requirements.lock && pip install -e '.[dev]' --no-deps
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: workbench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workbench:ci-password@localhost:5432/workbench
    defaults:
      run:
        working-directory: workbench/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
