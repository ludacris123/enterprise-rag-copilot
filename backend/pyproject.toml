[project]
name = "enterprise-rag-copilot-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.14,<2",
  "redis>=5,<6", "celery>=5.4,<6", "openai>=1.55,<3", "pgvector>=0.3,<1",
  "rank-bm25>=0.2,<1", "python-multipart>=0.0.12,<1", "pypdf>=5,<6",
  "prometheus-client>=0.21,<1", "structlog>=24,<26", "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2", "mcp>=1,<2", "pyjwt>=2.10,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
